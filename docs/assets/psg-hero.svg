<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" role="img" aria-labelledby="title description">
  <title id="title">PSG — project state graph</title>
  <desc id="description">The letters P, S, and G form one connected project state graph above the PSG wordmark.</desc>

  <rect width="1280" height="620" fill="#0B0E13"/>

  <g transform="translate(640 236)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- P: the project container. -->
    <path d="M-118 102V-80c0-42 31-72 74-72h43c53 0 88 33 88 82 0 51-35 83-88 83h-43"
          stroke="#E9E3D8" stroke-width="50"/>
    <path d="M-118 102V-80c0-42 31-72 74-72h43c53 0 88 33 88 82 0 51-35 83-88 83h-43"
          stroke="#8BC8F2" stroke-width="40"/>

    <!-- G: the graph closes the state into a checkable whole. -->
    <path d="M35-150c89 9 150 75 150 160 0 96-72 166-163 166-47 0-87-16-117-45M185 35h-72"
          stroke="#E9E3D8" stroke-width="50"/>
    <path d="M35-150c89 9 150 75 150 160 0 96-72 166-163 166-47 0-87-16-117-45M185 35h-72"
          stroke="#F4C75A" stroke-width="40"/>

    <!-- S: the path through changing project state. -->
    <path d="M64-92c-13 34-44 53-83 55-46 2-76 23-76 57 0 31 27 49 68 52 42 3 71 20 79 50"
          stroke="#E9E3D8" stroke-width="50"/>
    <path d="M64-92c-13 34-44 53-83 55-46 2-76 23-76 57 0 31 27 49 68 52 42 3 71 20 79 50"
          stroke="#FF9563" stroke-width="40"/>

    <!-- State nodes. -->
    <g stroke="#E9E3D8" stroke-width="8">
      <circle cx="-118" cy="102" r="27" fill="#F4C75A"/>
      <circle cx="35" cy="-150" r="27" fill="#91D4B2"/>
      <circle cx="185" cy="10" r="27" fill="#FF9563"/>
      <circle cx="22" cy="176" r="27" fill="#79BCEB"/>
    </g>

    <circle cx="-29" cy="-75" r="22" fill="#79BCEB" stroke="#E9E3D8" stroke-width="8"/>
  </g>

  <text x="640" y="518" text-anchor="middle" fill="#F7F8FA"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="86" font-weight="760" letter-spacing="10">PSG</text>
  <text x="640" y="578" text-anchor="middle" fill="#B8C0CC"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="25" font-weight="500" letter-spacing="7">project state graph</text>
</svg>
