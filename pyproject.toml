[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psg-runtime"
version = "1.1.0"
description = "Graph-guided project state, mutation governance, and evidence-based ship gates for coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PSG contributors" }]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.13,<2"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.12"]

[project.scripts]
psg = "psg.cli:main"
psg-mcp = "psg.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/psg/skill" = ["skills/psg/SKILL.md"]
"share/psg/skill/agents" = ["skills/psg/agents/openai.yaml"]
"share/psg/skill/references" = ["skills/psg/references/*.md"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
