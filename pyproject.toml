[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workgraph-runtime"
version = "1.0.0"
description = "Graph-guided project state, mutation governance, and evidence-based ship gates for coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "WorkGraph contributors" }]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.13,<2"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
workgraph = "workgraph.cli:main"
workgraph-mcp = "workgraph.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
