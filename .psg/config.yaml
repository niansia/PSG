version: 1
enabled: true
project: PSG
source_of_truth: git
authority:
  order:
  - host_mandatory_rules
  - current_user_instruction
  - accepted_psg_decisions_and_constraints
  - repository_native_rules
  - task_specific_skills
  - general_skills_and_preferences
  - psg_heuristics
  - model_preference
index:
  exclude:
  - .git/**
  - .psg/**
  - .venv/**
  - venv/**
  - node_modules/**
  - dist/**
  - build/**
  - tmp/**
  languages:
  - python
  mode: incremental
policies:
  default: mutable
context:
  default_token_budget: 12000
review:
  general_round_limit: 2
  targeted_fix_limit: 2
risk:
  high_requires_independent_review: true
dependencies:
  policy: conservative
  prefer:
  - standard_library
  - native_platform
  - existing_dependencies
  new_runtime_dependency_requires_justification: true
verification:
  commands:
    test:
      command: python -m pytest
      kind: test
      required: true
      timeout_seconds: 300
    lint:
      command: python -m ruff check .
      kind: lint
      required: true
      timeout_seconds: 120
